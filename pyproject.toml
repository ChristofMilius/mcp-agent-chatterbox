[project]
name = "mcp-agent-chatterbox"
version = "0.1.0"
description = "MCP server for local GPU-accelerated text-to-speech with Chatterbox - turbo, multilingual, and zero-shot voice cloning."
readme = "README.md"
authors = [
    { name = "Christof Milius" }
]
license = "MIT"
# 3.13 only, on purpose. chatterbox-tts pins torch==2.6.0 on Python < 3.14 but
# torch>=2.9.0 on 3.14+, so an open-ended range cannot be resolved against a
# single torch pin. The validation work (decoder, torchaudio reference path,
# full test suite) was done on 3.13 with the cu132 wheels pinned below.
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp[cli]>=2.0.0",
    "chatterbox-tts",
    # Pinned to the exact versions the live validation ran on, so that
    # redirecting torch to the CUDA wheel index below cannot fork the
    # resolution. torch/torchaudio were lifted from chatterbox-tts's 2.6.0
    # pins to the modern pair (torch 2.14 + torchaudio 2.11, which now ships
    # from PyPI as a plain wheel) after the S3Gen decoder, the multilingual
    # reference-clip path and the full test suite were re-validated onboard.
    "torch==2.14.0",
    "torchaudio==2.11.0",
    # Lower bound, not the old "setuptools<81" cap. That cap was the sole reason
    # we sat on 80.10.2 and carried GHSA-h35f-9h28-mq5c (fixed in 83.0.0): we
    # were holding ourselves below the fix. A floor lets uv pick the patched
    # release and never regresses below it.
    #
    # The cap itself was a misdiagnosis, kept here as a warning. It was added
    # because perth's watermarker import raised ImportError, blamed on
    # setuptools 81 dropping pkg_resources, and fixed by capping. But perth
    # 1.1.0 never imports pkg_resources -- the real ImportError was
    # "cannot import name 'resample' from 'librosa'", caused by a half-deleted
    # coverage install breaking numba, which broke librosa, which left
    # perth.PerthImplicitWatermarker = None. The cap never fixed that. It only
    # coincidentally rode along with the resolution that did. Do not restore
    # it; see the README section on what actually goes wrong.
    "setuptools>=83.0.0",
]

[project.scripts]
mcp-agent-chatterbox = "mcp_agent_chatterbox:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.10.0",
]

# Chatterbox on Windows: the default PyPI torch wheel is already a CUDA build,
# but pinning the official CUDA index makes the accelerator explicit and
# reproducible instead of an accident of the platform. cu132 carries the
# validated 2.14.0 release; it needs a driver from the CUDA 13.x era (this
# machine runs driver 617.14). torchaudio no longer ships per-CUDA indices —
# it lives on PyPI as a plain wheel that pairs with any matching torch.
[tool.uv.sources]
# Upstream snapshot, not the PyPI release. chatterbox-tts has shipped nothing
# since 0.1.7 (2026-03-26), but master carries what the PyPI wheel lacks:
#   - real v2/v3 multilingual checkpoint selection. 0.1.7's mtl_tts.from_pretrained
#     accepts no t3_model argument, so our t3_model knob would TypeError;
#   - the 500M EOS-noise-token trim (~40 ms of noise before EOS);
#   - the HF Xet-download fallback.
# The rev is a deliberate pin for reproducibility. Bump it in lockstep with the
# next intentional sync of the snapshot. Upstream still carries the norm_loudness
# float64 upcast (see engine._harden_reference_dtype) — regenerate that shim
# decision whenever the snapshot moves.
chatterbox-tts = { git = "https://github.com/resemble-ai/chatterbox.git", rev = "5de7a54aa4e5e2baadb0182dde554908b48b85c2" }
torch = { index = "pytorch-cu132" }

# Override chatterbox-tts's hard pins (torch/torchaudio ==2.6.0, transformers
# ==5.2.0, diffusers ==0.29.0, safetensors ==0.5.3) with the uplifted envelope.
# torch 2.14 + torchaudio 2.11 + transformers 5.10.4 + diffusers 0.38.0 +
# safetensors 0.8.0 were validated together on this machine (scratch venv,
# live renders on nano/turbo/multilingual including the reference-clip path)
# before this migration. The hard pins are the snapshot author's floor, not an
# upper bound; the overrides are the proof, not the presumption.
[tool.uv]
override-dependencies = [
    "torch==2.14.0+cu132",
    "torchaudio==2.11.0",
    "transformers==5.10.4",
    "diffusers==0.38.0",
    "safetensors==0.8.0",
    # gradio==6.8.0 is the snapshot's own hard pin. It is also the sole reason
    # starlette could not leave 0.52.x: gradio 6.8.0 requires starlette<1.0, and
    # the two advisories are only fixable together (starlette needs >=1.3.1,
    # gradio >=6.15.1). Neither package is imported anywhere in src/ or tests/ --
    # gradio is a demo-UI dependency we never load, and starlette serves the
    # ASGI path of mcp, which we use over stdio. Override, rather than
    # constraint-dependencies: a constraint cannot relax a hard "==" pin, and
    # overriding is the same lever already used for the torch pins above.
    "gradio>=6.15.1",
]

constraint-dependencies = [
    "starlette>=1.3.1",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
extend-exclude = [".venv", "tts_output", "voices", "logs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

# Point pyright at the project venv. Without this it resolves third-party
# imports against the system Python and reports every one of them as missing,
# which buries the findings that matter.
[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
# The project pins >=3.13,<3.14; pyright otherwise assumes 3.8 and flags
# every PEP 695 construct (3.12+) as a syntax error in code the runtime runs
# fine. `torch.version.cuda` / `torch.__version__` are a known gap in torch's
# bundled stubs (real at runtime, absent in `.pyi`) — left as-is, unfixed, on
# purpose: the stubs ship inside the installed package we must not edit.
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["mcp_agent_chatterbox"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
